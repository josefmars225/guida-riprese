<style>
/* The guide's own screen (the canvas artboard, 390 × 844) scaled to the phone; the real camera, sending and the archive sit over it. */
:root {
  color-scheme: dark;
  --ground: #2a2f1c;
  --ink: #F3EBDD;
  --soft: rgba(243, 235, 221, .8);
  --faint: rgba(243, 235, 221, .3);
  --line: rgba(243, 235, 221, .16);
  --champ: #D9C29A;
  --champ-hi: #E6D3B0;
  --deep: #17130C;
  --pane: rgba(18, 15, 9, .5);
  --rec: #E0583F;
  --display: "Bodoni Moda", "Didot", "Times New Roman", serif;
  --body: "Archivo", system-ui, -apple-system, sans-serif;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--ground); color: var(--ink); overflow-x: hidden; }
#stage { position: relative; margin: 0 auto; overflow: hidden; }
#board { position: absolute; left: 0; top: 0; width: 390px; height: 844px; transform-origin: 0 0; }
/* the screen takes the phone's own proportions: the artboard grows to the board's size, and so does the meadow seen through the glass */
#board > .prato { width: 100% !important; height: 100% !important; }
#board .lg-img { width: var(--bw, 390px) !important; height: var(--bh, 844px) !important; }
.owner { display: flex; justify-content: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 28px; }

/* overlays: same glass, type and buttons as the guide */
.ov { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; background: rgba(10, 8, 4, .62); font-family: var(--body); color: var(--ink); }

@keyframes up { from { transform: translateY(40px); opacity: 0; } }
.o-lab { font-family: var(--body); font-stretch: 125%; font-weight: 500; font-size: 10px; letter-spacing: .24em; text-transform: uppercase; color: var(--champ); }
.o-h { margin: 0; font-family: var(--display); font-weight: 400; font-size: 32px; line-height: 1.04; letter-spacing: -.012em; text-wrap: balance; }
.o-h em { color: var(--champ-hi); }
.o-p { margin: 0; font-size: 14px; line-height: 1.5; color: var(--soft); }
.o-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.o-x { width: 44px; height: 44px; border-radius: 50%; flex: none; display: grid; place-items: center; cursor: pointer; color: var(--ink); background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .16); }
.o-btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 54px; padding: 0 22px; border-radius: 999px; border: 0; font: 600 15px var(--body); cursor: pointer; flex: 1; transition: transform .25s cubic-bezier(.3, .7, .2, 1); }
.o-btn:active { transform: scale(.965); }
.o-btn.p { background: var(--champ); color: var(--deep); flex: 2; }
.o-btn.g { background: rgba(255, 255, 255, .08); color: var(--ink); border: 1px solid rgba(255, 255, 255, .18); }

.o-row { display: flex; gap: 10px; }

.o-video { display: block; width: 100%; max-height: 46vh; border-radius: 16px; background: #000; }

.o-err { margin: 0; color: #F2B8A6; font-size: 14px; }

.grp { display: flex; flex-direction: column; gap: 10px; }

.thumb { width: 76px; height: 76px; border-radius: 14px; object-fit: cover; background: rgba(18, 15, 9, .5); display: block; }
.item-t { display: block; font-family: var(--display); font-size: 19px; line-height: 1.15; }
.item-m { display: block; font-size: 12px; color: var(--soft); font-variant-numeric: tabular-nums; margin-top: 4px; }
.fb-row { border-radius: 18px; padding: 12px 16px; display: flex; flex-direction: column; gap: 6px; background: rgba(255, 255, 255, .05); border: 1px solid rgba(255, 255, 255, .1); }
.fb-stars { color: var(--champ); letter-spacing: .12em; font-size: 14px; }
.empty { text-align: center; padding: 22px 10px; }
.file-in { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
:focus-visible { outline: 2px solid var(--champ); outline-offset: 3px; }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }

/* never the phone's own play button over the meadow */
#board video::-webkit-media-controls, #board video::-webkit-media-controls-start-playback-button, #board video::-webkit-media-controls-overlay-play-button { display: none !important; -webkit-appearance: none; }
/* sending, shown over the guide while videos travel */
.send { position: fixed; left: 50%; transform: translateX(-50%); top: calc(5px + env(safe-area-inset-top, 0px)); z-index: 40; display: flex; align-items: center; gap: 9px; max-width: calc(100% - 32px); min-height: 28px; padding: 0 14px; border-radius: 999px; font: 600 12px var(--body); color: var(--ink); background: rgba(18, 15, 9, .62); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border: 1px solid rgba(255, 255, 255, .16); white-space: nowrap; }
.send-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--champ); animation: blink 1.4s ease-in-out infinite; flex: none; }
.send.ok .send-dot { animation: none; background: #B9D49A; }
.send.err .send-dot { animation: none; background: var(--rec); }
@keyframes blink { 50% { opacity: .3; } }
